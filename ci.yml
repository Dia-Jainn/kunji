name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Scan the demo app and validate its CBOM
        run: kunji scan examples/demo-bank -o out
      - uses: actions/upload-artifact@v4
        with:
          name: demo-bank-report-py${{ matrix.python }}
          path: out/
