[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kunji"
version = "0.3.1"
description = "Enterprise cryptographic discovery: CycloneDX 1.6 CBOM, post-quantum risk scoring and migration plan"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Team Orchestra (SIH 2026, team 177246)"}]
keywords = ["cbom", "cyclonedx", "post-quantum", "pqc", "ml-kem", "cryptography", "inventory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=44",
    "cyclonedx-python-lib[json-validation]>=8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kunji = "kunji.cli:main"

[tool.setuptools.packages.find]
include = ["kunji*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
